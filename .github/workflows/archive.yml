name: Archive Slack links
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      rescan:
        description: "Re-read the whole 90-day window, ignoring last_run"
        type: boolean
        default: false
      debug:
        description: "Log raw Slack channel info and history for troubleshooting"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python slack_archiver.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNELS: ${{ vars.CHANNELS }}
          RESCAN: ${{ inputs.rescan }}
          DEBUG: ${{ inputs.debug }}
      - name: Commit changes
        if: ${{ !cancelled() }}   # still save healthy channels if one channel failed
        run: |
          git config user.name "slack-archiver"
          git config user.email "actions@github.com"
          git add data docs || exit 0   # nothing written yet
          git diff --cached --quiet || git commit -m "Archive new Slack links"
          git push